<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="t d"><title id="t">laserfix repairs an SVG so the laser burns each line once</title><desc id="d">A tag design whose outline and hole were pasted twice goes into laserfix, which removes the two copies and checks the result again: line burned twice goes from 248.5 mm to 0.0 mm, and crossings stay at 0.</desc><rect width="880" height="330" rx="16" fill="#101217"/><rect x="24" y="40" width="250" height="250" rx="12" fill="#181B22" stroke="#2E333B"/><text x="44" y="70" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#9AA4AF">stacked.svg</text><g fill="none" stroke="#F4F4F0" stroke-width="1.6" stroke-linecap="round"><rect x="44" y="110" width="210" height="150" rx="18"/><circle cx="74" cy="185" r="9"/><path d="M119 161 H224 M119 185 H209 M119 209 H194"/></g><g fill="none" stroke="#FF6B4A" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"><rect x="48" y="114" width="210" height="150" rx="18"/><circle cx="78" cy="189" r="9"/></g><text x="254" y="100" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" text-anchor="end" fill="#FF6B4A">pasted twice</text><path d="M290 165 H330" stroke="#9AA4AF" stroke-width="2" stroke-linecap="round"/><path d="M324 159 L332 165 L324 171" fill="none" stroke="#9AA4AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(348 118) scale(1.35)"><path d="M42.4 15.4 C41.6 11.2 38.8 8.4 35.2 7.8 C36.6 9.4 37 10.8 36.8 12 C35.2 9.8 32.4 8.9 29.6 9.7 C31.2 10.9 31.9 12.3 31.8 13.5 C30.7 13 29.3 13.1 28.2 14.1 C29.8 14.5 30.6 15.3 30.9 16.4 Q36.4 13 42.4 15.4 Z" fill="#E8472B"/><path fill-rule="evenodd" fill="#F4F4F0" d="M47.8 21.8 C46.5 15 40 12.5 34.5 13.5 C29 14.5 26 18.5 24 23 C21 29 17 33 12.5 37 L4 41.5 L7 43.2 L4.5 45.5 L14 42.5 C17 46 23 49 31 48.5 C40 48 46.5 42 47.5 34 C47.8 31 48 29 47.9 26.2 L53.5 24.3 Z M44.5 22 A3 3 0 1 0 38.5 22 A3 3 0 1 0 44.5 22 Z"/></g><text x="386" y="222" font-family="Outfit, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#F4F4F0">laserfix</text><path d="M442 165 H482" stroke="#9AA4AF" stroke-width="2" stroke-linecap="round"/><path d="M476 159 L484 165 L476 171" fill="none" stroke="#9AA4AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="498" y="40" width="358" height="250" rx="12" fill="#181B22" stroke="#2E333B"/><text x="518" y="80" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#F4F4F0" xml:space="preserve">Changed</text><text x="518" y="110" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#F4F4F0" xml:space="preserve">Copies removed</text><text x="836" y="110" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="end" fill="#9AA4AF">2</text><text x="518" y="140" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#F4F4F0" xml:space="preserve">Line removed</text><text x="836" y="140" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="end" fill="#9AA4AF">248.5 mm</text><text x="518" y="182" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#F4F4F0" xml:space="preserve">Checked again</text><text x="518" y="212" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#F4F4F0" xml:space="preserve">Line burned twice</text><text x="518" y="236" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">  248.5 mm → 0.0 mm</text><text x="518" y="266" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#F4F4F0">Crossings</text><text x="836" y="266" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="end" fill="#9AA4AF">0 → 0</text></svg>
